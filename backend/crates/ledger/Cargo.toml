[package]
name    = "ledger"
version = "0.1.0"
edition = "2021"

[dependencies]
shared        = { path = "../shared", features = ["sqlx"] }
chrono        = { version = "0.4",  features = ["serde"] }
async-trait   = "0.1"
rust_decimal  = { version = "1.40", features = ["serde-with-str"] }
thiserror     = "2"
uuid          = { version = "1",    features = ["serde", "v4"] }
tokio         = { version = "1",    features = ["full"] }
serde         = { version = "1",    features = ["derive"] }
serde_json    = "1"
clap          = { version = "4",    features = ["derive", "env"] }
sqlx          = { version = "0.8",  features = ["runtime-tokio-native-tls", "sqlite", "chrono", "uuid"] }

# HTTP interface — only compiled when the `http` feature is enabled.
axum          = { version = "0.8",  features = ["json", "macros"], optional = true }
tower         = { version = "0.5",  optional = true }
tower-http    = { version = "0.6",  features = ["cors", "trace"],  optional = true }

[features]
default = []
http    = ["dep:axum", "dep:tower", "dep:tower-http"]

# The `ffi` feature gates interface/ffi/mod.rs.
# No extra crate dependencies are needed — the FFI functions are plain Rust.
# flutter_rust_bridge lives only in the netflow-ffi crate, not here.
ffi     = []
