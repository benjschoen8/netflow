[package]
name = "ledger"
version = "0.1.0"
edition = "2024"

[dependencies]
shared= { path = "../shared", features = ["sqlx"] }
chrono = { version = "0.4.43", features = ["serde"] }
async-trait = "0.1.89"
rust_decimal = "1.40.0"
thiserror = "2.0.18"
uuid = { version = "1.20.0", features = ["serde", "v4"] }
enum_dispatch = "0.3"
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres"], optional = true }
